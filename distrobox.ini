[Terra-CPU]
home=$CONTAINER_HOME
image=$IMAGE_NAME
additional_flags="--security-opt=label=disable"
init=true
pull=false
replace=false
root=false
start_now=true

[Terra-CUDA]
home=$CONTAINER_HOME
image=$IMAGE_NAME
additional_flags="--security-opt=label=disable --device=nvidia.com/gpu=all"
init=true
pull=false
replace=false
root=false
start_now=true

